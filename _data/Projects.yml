subject: Research Interest & Projects
listing-order: 2
icon: "/assets/img/clipboard-list.svg"
contents:
  - title: "Enhanced Reasoning in Large AI / eXplainable AI"
    rols: "AI 추론 결과는 사실에 근거하고 그 추론 과정은 설명가능 하여야 합니다. Large AI가 문제의 해결을 위한 연쇄적인 추론 단계를 배우는 것은 실제 AI의 추론 성능을 향상시키며, 응답 결과가 어떠한 근거에서 도출되었는지를 설명할 수 있는 근거가 됩니다. Large AI가 추론 과정에서 타깃 영역별 지식정보, 신뢰도, 설명가능성을 이용하여 최적의 경로를 선택한다면, 전문가 수준의 높은 추론 능력을 확보할 수 있습니다. 이러한 여러 자원을 이용한 향상된 AI 추론 방법론을 개발하여 한국어 Large AI의 성능을 높이고, 전문가 영역에서 의사결정을 지원할 수 있는 수준의 추론능력을 얻을 수 있도록 기술을 확대 개발하고 있습니다."
    description:
      - "**\"대화 기반 설명가능성을 멀티모달로 제공하는 인공지능 기술 개발\" 국책과제 (2년, 2025 - 2026)**"
      - "\"설명가능한 전문가 의사결정 지원기술 개발\" 국책과제 (공동연구 책임자, 3년, Mar. 2022 - 2024)"
      - "NeurIPS2024, \"How Do Large Language Models Acquire Factual Knowledge During Pretraining?\""
      
  - title: "AI Alignment / Responsible AI"
    role: "바람직한 AI 모델은 인간의 의지와 정렬된 행동을 하여 사용성이 높고, 사회/윤리성을 가진 행동을 하며, 사실에 기반한 공정한 응답을 할 수 있어야 합니다. AI를 이러한 방향으로 학습하기 위한 AI Alignment기술을 개발하고 한국어 Large AI모델에 선도 적용하고 있습니다. 기술 확대를 위해 인지/사회/언어학계 및 여러 초거대AI 사업체들과 함께 컨소시엄을 이루어 협의하고 요소 기술을 개발하고 있으며, AI평가체계를 마련하고 공개하여 국가 기술 발전에 기여하고 있습니다."
    description:
      - "**\"생성형 AI의 사회/윤리성 향상 연구개발\" 국책과제 (공동연구 책임자, 3년, Mar. 2024 – 2026)**"
      - "IITP/NIA \"초거대AI 윤리/유용성 평가 데이터 구축\" 국책과제 (자문위원, Jul. 2023 – Jan. 2024)"

  - title: "Multi Agentic AI / Large AI Transformation"
    role: "생성형 AI에 기반한 에이전트 기술은 단순한 하나의 단일 모델에서 벗어나 여러 단계의 수행 계획을 스스로 수립하고 실생활의 여러 도구를 사용하여 확보된 정보와 주변 에이전트간의 협력에 기반하여 결과물을 도출하고, 이에 기반한 실세계의 행동을 수행하는 멀티 에이전트 기술로 진화되고 있습니다. 에이전트에 기반한 서비스 모델링 기술은 기존의 금융, 공공, 행정, 법률 등 다양한 영역에서 기존 서비스를 혁신하고 있으며, 화자인식, 음성메모, 상담분류/요약, 상담대화, 추천, 질의응답 등의 결합으로 AI기반 Contact Center, 통화비서, 문자광고/커머스 등과 같은 새로운 사업 형상이 등장하고 있습니다. Large AI Transformation의 영역은 교육, 농업, 해양관제 등 다양한 영역으로 확대 예정입니다."
    description:
      - "멀티 에이전트에 기반한 농작물 멀티모달 질의응답 시스템 개발 (예정, 2025 - Present)"
      - "Large AI 기반의 AI전화 Assistant(통화비서), AI문자광고 카피라이터, ACen Cloud"
      - "KT AICC Project, Text Analytics(2018), 상담Assist(2020), 상담보이스봇(2021)"
      - "국립국어원 AI경진대회 ”AI말평” 자문 및 심사위원(2023 - 2025)"
      - "NIA AI Hub “데이터댐 사업” 데이터 구축/활용 자문위원(2021, 2022), NIA AI경진대회 심사위원(2022, 2023)"
    
