contents:
  - title: "Enhanced Reasoning in Large AI Foundation Model"
    rols: "생성형AI의 근간인 AI파운데이션 모델의 학습 및 추론 기술을 연구합니다. Large AI가 문제의 해결을 위한 연쇄적인 추론 과정을 배우는 것은 실제 AI의 추론 성능을 향상시키며, 응답 결과가 어떠한 근거에서 도출되었는지를 설명할 수 있는 근거가 됩니다. Large AI 파운데이션 모델은 멀티모달 모델로 Video/Audio grounding을 포함하고, 실제 환경에서의 behavior 생성을 위한 VLA, 월드모델로의 확대가 진행되고 있습니다. 이러한 파운데이션 모델의 성공을 위해서는 여러 단계별 학습 기법과 함께 시물레이션 및 실제 환경과의 interaction을 통한 강화학습 및 최적화 기법이 핵심입니다."
    description:
      - "**\"[국가대표 K-AI] 글로벌 프런티어 파운데이션 모델 개발 및 국내 AI 혁신 생태계 조성 프로젝트\" (공동연구 책임자, 2025 - 2027)**"
      - "**\"대화 기반 설명가능성을 멀티모달로 제공하는 인공지능 기술 개발\" (2022 - 2026)**"
      - "한국형 초거대AI기술 선도연구 \"초거대AI 믿:음 개발\" (연구책임자, 2019 - 2024)"
      - "Preprint, StreamWeave: Reconciling Off-Policy Expert Supervision with Fully
Asynchronous Policy Learning"
      - "EMNLP2026, Persistent Teacher Anchoring for Tool-Using Agents"
      - "CoLM2026, Headroom-Drift Replay: A Primitive for Principled Replay Control in GRPO"
      - "NeurIPS2024, How Do Large Language Models Acquire Factual Knowledge During Pretraining?"
      - "ACL2024, Improving Conversational Abilities of Quantized LLMs via Direct Preference Alignment"
#      - "ASPLOS2024, Exegpt: Constraint-aware resource scheduling for llm inference"
#      - "ECCV2024, \"BI-MDRG: Bridging Image History in Multimodal Dialogue Response Generation\""
#      - "EMNLP2023, NASH: A Simple Unified Framework of Structured Pruning for Accelerating Encoder-Decoder LMs"
      - "정보과학회지, Large AI to Everywhere, 초거대 AI 믿:음"

  - title: "Vertical AI Transformation using Multimodal Foundation Model"
    role: "생성형 AI에 기반한 에이전트 기술은 단순한 하나의 단일 모델에서 벗어나 여러 단계의 수행 계획을 스스로 수립하고 실생활의 여러 도구를 사용하여 확보된 정보와 주변 에이전트간의 협력에 기반하여 결과물을 도출하고, 이에 기반한 실세계의 행동을 수행하는 멀티 에이전트 기술로 진화되고 있습니다. 에이전트에 기반한 서비스 모델링 기술은 기존의 금융, 공공, 행정, 법률, 상담, 교육, 농업, 엔터테인먼트 등 다양한 영역에서 기존 서비스를 혁신하고 있으며, 제조, 로봇, 자율주행 등 Real world에 기반한 Physical AI로 확대되어 가고 있습니다. 각 버티컬 영역에서 고품질의 데이터의 합성과 증강 기술을 확보하며, LVLM, LALM, VLA 및 World Model의 최적화 학습 기술을 개발합니다."
    description:
      - "**\"[AX대학원] Cyber-Physics기반 제조혁신 AI융합인재양성 사업\" (2026 - 2031)**"
      - "**\"[생성AI 선도인재양성사업] 멀티모달 AI 에이전트 시대에 적합한 실무형 AI인재 육성 사업\" (공동연구책임자, 2025 - 2028)**"
      - "\"멀티 에이전트에 기반한 농작물 멀티모달 질의응답 시스템 개발\" (연구책임자, 2025)"
      - "Large AI 기반 AX Projects, 기가지니(2021), AICC(2022), 지니TV 큐레이션(2023) 연구책임자"
      - "Preprint, \"VGM-QA: Multi-Hop Visual Document Question Answering with Step-Level Evidence Grounding\""
      - "Preprint, \"WAVES: Waveform-Assisted Video-to-Editable Stems for Visual-Only Multitrack Audio Generation\""
      - "Preprint, \"ACMAudio: Navigating Reference-Induced Desynchronization in Audio-Conditioned Video-to-Audio Generation\""
      - "ACL2026, \"Omni-Embed-Audio: Leveraging Multimodal LLMs for Robust Audio-Text Retrieval\""
      - "AAAI2025, RILQ: Rank-Insensitive LoRA-based Quantization Error Compensation for Boosting 2-bit Large Language Model Accuracy"
      - "EMNLP2024, Towards Fast Multilingual LLM Inference: Speculative Decoding and Specialized Drafters"
      - "AAAI2024, \"Structure-Aware Multimodal Sequential Learning for Visual Dialog\""
#      - "NeurIPS2023, Token-scaled logit distillation for ternary weight generative language models"

  - title: "AI Alignment / Responsible AI"
    role: "바람직한 AI 모델은 인간의 의지와 정렬된 행동을 하여 사용성이 높고, 사회/윤리성을 가진 행동을 하며, 사실에 기반한 공정한 응답을 할 수 있어야 합니다. AI를 이러한 방향으로 학습하기 위한 AI Alignment기술을 개발하고 한국어 Large AI모델에 선도 적용하고 있습니다. 기술 확대를 위해 인지/사회/언어학계 및 여러 초거대AI 사업체들과 함께 컨소시엄을 이루어 협의하고 요소 기술을 개발하고 있으며, AI평가체계를 마련하고 공개하여 국가 기술 발전에 기여하고 있습니다."
    description:
      - "**\"생성형 AI의 사회/윤리성 향상 연구개발\" 국책과제 (공동연구 책임자, 2024 – 2026)**"
      - "IITP/NIA \"초거대AI 윤리/유용성 평가 데이터 구축\" 국책과제 (자문위원, 2023 – 2024)"
      - "Preprint, \"VLM-CCA: A Multidimensional Benchmark and Scalable Data Generation
Framework for Cultural Context Awareness in Large Vision-Language Models\""
      - "ACL2025, \"Evaluating Visual and Cultural Interpretation: The K-Viscuit Benchmark with Human-VLM Collaboration\""

  - title: "Natural Language Processing & Conversational AI"
    role: 한국어 대화/질의응답 기술을 개발하고, 한국어 음성인식/합성기술과 결합하여 한국어 음성대화 기술을 개발합니다.
          생성형AI에 기반한 에이전트의 Plan수립, 대화 의도해석 및 멀티턴 추론 기술을 연구합니다.
          형태소분석, 품사태거, 구문분석, 의미분석, 개체명태깅, 담화분류 등의 한국어 NLP 요소기술의 원리를 파악하고,
          생성형AI에 기반한 정보추출, 기계독해, 질의응답, 문서요약, 오류교정, 의도기반 검색 등 응용기술을 개발합니다.
    description:
      - "국내 최초의 AI TV 기가지니 개발 및 출시 (2017, 대화비서 Agent 연구책임자)"
      - "\"ExoBrain: 빅데이터 기반 자가학습형 지식베이스/추론기술\" (공동연구책임자, 10년, 274억, 2014 – 2023)"
      - "\"다중영역 대화형 개인비서 SW 원천기술\" 국책과제 (공동연구 책임자, 3년, 총액 75억, Mar. 2012 – Feb. 2015)"
      - "\"음성대화형 홈네트워크/IPTV 제어 기술 개발\" (대화시스템 연구책임자, Mar. 2005 – Apr. 2015)"
#      - 국내 최초의 Open Source 한국어 형태소분석기, 품사태거 공개
