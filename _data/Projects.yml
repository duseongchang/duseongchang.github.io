  - title: "Natural Language Processing & Conversational AI"
    role: 한국어 대화/질의응답 기술을 개발하고, 한국어 음성인식/합성기술과 결합하여 한국어 음성대화 기술을 개발합니다.
          생성형AI에 기반한 에이전트의 Plan수립, 대화 의도해석 및 멀티턴 추론 기술을 연구합니다.
          형태소분석, 품사태거, 구문분석, 의미분석, 개체명태깅, 담화분류 등의 한국어 NLP 요소기술의 원리를 파악하고,
          생성형AI에 기반한 정보추출, 기계독해, 질의응답, 문서요약, 오류교정, 의도기반 검색 등 응용기술을 개발합니다.
    description:
      - "국내 최초의 AI TV 기가지니 개발 및 출시 (2017, 대화비서 Agent 연구책임자)"
