subject: News
listing-order: 1
icon: "/assets/img/trophy.svg"
contents:
  - title: 2026
    description:
    - "(Aug 2026) Our paper has been accepted to **EMNLP2026**. \"Persistent Teacher Anchoring for Tool-Using Agents\""
    - "(Jul 2026) Ph.D. student HJ Yoo has been selected as an \"AI Innovation Talent\" by IITP."
    - "(Jun 2026) Our paper has been accepted to **CoLM2026**. \"Headroom-Drift Replay: A Primitive for Principled Replay Control in GRPO\""
    - "(Jun 2026) Our lab has received the \"Academic Contribution Award\" at KCC2026"
    - "(Apr 2026) Our paper has been accepted to **ACL2026**. \"Omni-Embed-Audio: Leveraging Multimodal LLMs for Robust Audio-Text Retrieval\""
    - "(Apr 2026) Master's student IS Lee has begun a six-month \"Generative AI Talent Development Internship\" at NC AI."
    - "(Jan 2026) Our research team has received the \"Albatross Academic Award\", presented by the Sogang University Alumni Association."
  - title: 2025
    description:
    - "(Jun 2025) Co-authored two papers accepted at **ACL2025** and **AAAI2025**"
    - "(Jun 2025) Appointed as the Principal Investigator (PI) of Sogang University for two national research projects funded by the Institute for Information & Communications Technology Planning & Evaluation (IITP): the \"K-AI Foundation Model Development Project\" with Upstage and the \"Generative AI Leading Talent Growth Project\" with NC AI."
    - "(Mar 2025) Appointed as an Associate Professor leading the NLP&ISDS Lab at Sogang University."
